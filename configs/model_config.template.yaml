# Model and API Configuration for PaperVizAgent

# Default Models
defaults:
  model_name: "gemini-3-flash-preview"
  image_model_name: "gemini-3-pro-image-preview"

# API Keys.
api_keys:
  google_api_key: ""
  openai_api_key: ""   # API Key for text model (e.g. DeepRouter)
  image_openai_api_key: ""   # API Key for image model; falls back to openai_api_key if empty
  anthropic_api_key: ""

# Base URLs for third-party API providers.
# All models (including gemini-*) will be routed through the OpenAI-compatible
# client when openai_base_url is set.
base_urls:
  openai_base_url: "https://deeprouter.top/v1"   # DeepRouter endpoint for text model
  image_openai_base_url: ""   # Base URL for image model; falls back to openai_base_url if empty
  anthropic_base_url: ""

# OpenAI API style: "chat" (default, uses /v1/chat/completions)
#                   "responses" (uses /v1/responses, OpenAI Responses API)
openai_api_style: "chat"

# API style specifically for the image model (image_model_name).
# Override here if the image model uses a different endpoint than openai_api_style.
# "chat" -> /v1/chat/completions   "responses" -> /v1/responses
image_api_style: "chat"

